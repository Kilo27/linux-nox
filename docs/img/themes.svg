<title id="title">Terminal themes</title>
<desc id="desc">Six dark terminal colour themes shown as small status lists with their colour swatches: nox default, Nord, Gruvbox, Solarized, Catppuccin and Tokyo Night.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.62}}
.blink{animation:blink 1.2s steps(1) infinite}
.breathe{animation:breathe 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.breathe{animation:none}}
</style>
