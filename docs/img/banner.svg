<title id="title">nox: a tiny Linux for an old laptop</title>
<desc id="desc">The nox wordmark with a blinking cursor, the tagline, and a small terminal listing projects and their status.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.62}}
.blink{animation:blink 1.2s steps(1) infinite}
.breathe{animation:breathe 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.breathe{animation:none}}
</style>
