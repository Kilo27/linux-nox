de-project</text><text x="930" y="292" font-size="16" fill="#565f89">stopped</text><text x="1035" y="292" font-size="16" fill="#565f89"></text><text x="784" y="318" font-size="16" fill="#9ece6a" font-weight="700">$</text><rect x="804" y="304" width="10" height="18" fill="#7dcfff" class="blink"/>
