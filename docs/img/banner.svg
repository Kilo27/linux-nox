<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">nox: a tiny Linux for an old laptop</title>
<desc id="desc">Banner showing the nox wordmark with a blinking cursor beside a mini terminal listing projects and their status.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.05}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes bar{0%,100%{opacity:1}50%{opacity:.55}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{animation:flow 1s linear infinite}
.breathe{animation:bar 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow,.breathe{animation:none}}
</style>
<defs>
<linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dcfff"/><stop offset="0.5" stop-color="#bb9af7"/><stop offset="1" stop-color="#ff79c6"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1c2b"/><stop offset="1" stop-color="#10111a"/></linearGradient>
<radialGradient id="g1" cx=".88" cy=".05" r=".65"><stop offset="0" stop-color="#bb9af7" stop-opacity=".42"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx=".02" cy="1" r=".6"><stop offset="0" stop-color="#7dcfff" stop-opacity=".30"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/></radialGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".045"/></pattern>
<filter id="glow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="clip"><rect width="1200" height="380" rx="26"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect x="0" y="0" width="1200" height="380" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="380" fill="url(#g1)"/>
<rect x="0" y="0" width="1200" height="380" fill="url(#g2)"/>
<rect x="0" y="0" width="1200" height="380" fill="url(#scan)"/>
<circle cx="44" cy="40" r="7" fill="#f7768e"/><circle cx="68" cy="40" r="7" fill="#e0af68"/><circle cx="92" cy="40" r="7" fill="#9ece6a"/>
<text x="116" y="45" font-size="14" fill="#565f89">~/nox</text>
<text x="56" y="236" font-size="190" font-weight="800" fill="url(#word)" filter="url(#glow)" textLength="345" lengthAdjust="spacingAndGlyphs">nox</text>
<rect x="420" y="126" width="76" height="112" rx="6" fill="#7dcfff" class="blink"/>
<text x="60" y="288" font-size="32" fill="#c0caf5" font-weight="700">a tiny Linux for an old laptop</text>
<text x="60" y="326" font-size="16" fill="#9aa5ce">boots fast · runs your projects side by side · one vivid control panel</text>
