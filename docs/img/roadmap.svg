<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">The road to nox</title>
<desc id="desc">Twelve numbered phases in two rows grouped by colour: foundation phases 0 to 4, run things phases 5 and 6, the panel phases 7 to 9, finish phases 10 and 11.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.05}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes bar{0%,100%{opacity:1}50%{opacity:.55}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{animation:flow 1s linear infinite}
.breathe{animation:bar 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow,.breathe{animation:none}}
</style>
