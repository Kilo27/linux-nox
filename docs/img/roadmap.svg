<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">The road to nox</title>
<desc id="desc">Twelve numbered phases in two rows grouped by colour: foundation, run things, the panel and finish. From prep through the service runner and the rental agent to the on-screen panel, GitHub cloning, Minecraft and reliability.</desc>
