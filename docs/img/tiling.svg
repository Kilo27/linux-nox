<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">How panel windows tile</title>
<desc id="desc">Four layout presets (stack, side by side, grid, main plus side), then three steps for rearranging: drag a divider, drag a title bar onto an edge with a dashed preview, and the window snaps into place with the old gap closed.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.62}}
.blink{animation:blink 1.2s steps(1) infinite}
.breathe{animation:breathe 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.breathe{animation:none}}
</style>
<rect x="0.5" y="0.5" width="1099" height="539" rx="12" fill="#1a1b26" stroke="#343a55" stroke-width="1"/><text x="32" y="46" font-size="20" fill="#c0caf5" font-weight="600">Windows tile. They never overlap.</text><text x="32" y="70" font-size="13" fill="#8a92b8">the screen is split into regions, and every window is exactly one region</text><text x="32" y="110" font-size="12" fill="#8a92b8">Layouts</text><rect x="32" y="124" width="236" height="128" rx="6" fill="#16161e" stroke="#343a55" stroke-width="1"/><rect x="39" y="131" width="222" height="26.68" rx="3" fill="#b8a1e1" fill-opacity="0.1" stroke="#b8a1e1" stroke-width="1" stroke-opacity="0.4"/><text x="47" y="149" font-size="12" fill="#b8a1e1">projects</text><rect x="39" y="161.68" width="222" height="39.66" rx="3" fill="#96b574" fill-opacity="0.1" stroke="#96b574" stroke-width="1" stroke-opacity="0.4"/><text x="47" y="179.68" font-size="12" fill="#96b574">agent</text><rect x="39" y="205.34" width="222" height="39.66" rx="3" fill="#dd9d77" fill-opacity="0.1" stroke="#dd9d77" stroke-width="1" stroke-opacity="0.4"/><text x="47" y="223.34" font-size="12" fill="#dd9d77">minecraft</text><text x="150" y="276" font-size="13" fill="#c0caf5" text-anchor="middle">Stack</text><rect x="294" y="124" width="236" height="128" rx="6" fill="#16161e" stroke="#343a55" stroke-width="1"/><rect x="301" y="131" width="59.28000000000001" height="114" rx="3" fill="#b8a1e1" fill-opacity="0.1" stroke="#b8a1e1" stroke-width="1" stroke-opacity="0.4"/><rect x="364.28000000000003" y="131" width="77.36" height="114" rx="3" fill="#96b574" fill-opacity="0.1" stroke="#96b574" stroke-width="1" stroke-opacity="0.4"/><text x="372.28000000000003" y="149" font-size="12" fill="#96b574">agent</text><rect x="445.64" y="131" width="77.36" height="114" rx="3" fill="#dd9d77" fill-opacity="0.1" stroke="#dd9d77" stroke-width="1" stroke-opacity="0.4"/><text x="412" y="276" font-size="13" fill="#c0caf5" text-anchor="middle">Side by side</text><rect x="556" y="124" width="236" height="128" rx="6" fill="#16161e" stroke="#343a55" stroke-width="1"/><rect x="563" y="131" width="109" height="55" rx="3" fill="#b8a1e1" fill-opacity="0.1" stroke="#b8a1e1" stroke-width="1" stroke-opacity="0.4"/><text x="571" y="149" font-size="12" fill="#b8a1e1">projects</text><rect x="676" y="131" width="109" height="55" rx="3" fill="#96b574" fill-opacity="0.1" stroke="#96b574" stroke-width="1" stroke-opacity="0.4"/><text x="684" y="149" font-size="12" fill="#96b574">agent</text><rect x="563" y="190" width="109" height="55" rx="3" fill="#dd9d77" fill-opacity="0.1" stroke="#dd9d77" stroke-width="1" stroke-opacity="0.4"/><text x="571" y="208" font-size="12" fill="#dd9d77">minecraft</text><rect x="676" y="190" width="109" height="55" rx="3" fill="#8bc2e2" fill-opacity="0.1" stroke="#8bc2e2" stroke-width="1" stroke-opacity="0.4"/><text x="684" y="208" font-size="12" fill="#8bc2e2">chat-bot</text><text x="674" y="276" font-size="13" fill="#c0caf5" text-anchor="middle">Grid</text><rect x="818" y="124" width="236" height="128" rx="6" fill="#16161e" stroke="#343a55" stroke-width="1"/><rect x="825" y="131" width="54.760000000000005" height="114" rx="3" fill="#b8a1e1" fill-opacity="0.1" stroke="#b8a1e1" stroke-width="1" stroke-opacity="0.4"/><rect x="883.76" y="131" width="163.24" height="69.16" rx="3" fill="#96b574" fill-opacity="0.1" stroke="#96b574" stroke-width="1" stroke-opacity="0.4"/><text x="891.76" y="149" font-size="12" fill="#96b574">agent</text><rect x="883.76" y="204.16" width="79.62" height="40.84" rx="3" fill="#dd9d77" fill-opacity="0.1" stroke="#dd9d77" stroke-width="1" stroke-opacity="0.4"/><rect x="967.38" y="204.16" width="79.62" height="40.84" rx="3" fill="#8bc2e2" fill-opacity="0.1" stroke="#8bc2e2" stroke-width="1" stroke-opacity="0.4"/><text x="975.38" y="222.16" font-size="12" fill="#8bc2e2">chat-bot</text><text x="936" y="276" font-size="13" fill="#c0caf5" text-anchor="middle">Main + side</text><text x="32" y="328" font-size="12" fi