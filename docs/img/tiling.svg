<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">How panel windows tile</title>
<desc id="desc">Four layout presets (stack, side by side, grid, main plus side), then three steps for rearranging: drag a divider, drag a title bar onto an edge with a dashed preview, and the window snaps into place with no overlap. Three rules follow: Projects is always open, closing a window only hides it, and the layout is the same on every device.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.05}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes bar{0%,100%{opacity:1}50%{opacity:.55}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{animation:flow 1s linear infinite}
.breathe{animation:bar 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow,.breathe{animation:none}}
</style>
<defs>
<linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1c2b"/><stop offset="1" stop-color="#12131b"/></linearGradient>
</defs>
