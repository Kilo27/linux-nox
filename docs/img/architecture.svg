<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">The nox stack</title>
<desc id="desc">Seven stacked layers: the panel, your projects, noxd, init, BusyBox plus dropbear plus musl, the Linux kernel and the laptop hardware. The top four are hand-written; the next two are borrowed.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.62}}
.blink{animation:blink 1.2s steps(1) infinite}
.breathe{animation:breathe 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.breathe{animation:none}}
</style>
<rect x="0.5" y="0.5" width="899" height="619" rx="12" fill="#1a1b26" stroke="#343a55" stroke-width="1"/><text x="32" y="46" font-size="20" fill="#c0caf5" font-weight="600">The nox stack</text><text x="32" y="70" font-size="13" fill="#8a92b8">seven layers, from the hardware up to the panel</text><rect x="32" y="92" width="600" height="62" rx="6" fill="#8fa2bc" fill-opacity="0.1" stroke="#8fa2bc" stroke-width="1" stroke-opacity="0.42"/><text x="52" y="118" font-size="15" fill="#8fa2bc" font-weight="600">The panel</text><text x="52" y="139" font-size="13" fill="#8a92b8">the tiling UI, drawn straight to the laptop’s screen</text><rect x="32" y="162" width="600" height="62" rx="6" fill="#8fa2bc" fill-opacity="0.1" stroke="#8fa2bc" stroke-width="1" stroke-opacity="0.42"/><text x="52" y="188" font-size="15" fill="#8fa2bc" font-weight="600">Your projects</text><text x="52" y="209" font-size="13" fill="#8a92b8">rental-agent · minecraft · anything else</text><rect x="32" y="232" width="600" height="62" rx="6" fill="#8fa2bc" fill-opacity="0.1" stroke="#8fa2bc" stroke-width="1" stroke-opacity="0.42"/><text x="52" y="258" font-size="15" fill="#8fa2bc" font-weight="600">noxd</text><text x="52" y="279" font-size="13" fill="#8a92b8">starts, watches and restarts every project</text><rect x="32" y="302" width="600" height="62" rx="6" fill="#8fa2bc" fill-opacity="0.1" stroke="#8fa2bc" stroke-width="1" stroke-opacity="0.42"/><text x="52" y="328" font-size="15" fill="#8fa2bc" font-weight="600">/init</text><text x="52" y="349" font-size="13" fill="#8a92b8">the first program at boot: disks, network, clock</text><rect x="32" y="372" width="600" height="62" rx="6" fill="#dd9d77" fill-opacity="0.1" stroke="#dd9d77" stroke-width="1" stroke-opacity="0.42"/><text x="52" y="398" font-size="15" fill="#dd9d77" font-weight="600">BusyBox · dropbear · musl</text><text x="52" y="419" font-size="13" fill="#8a92b8">basic commands, an SSH server and the C library</text><rect x="32" y="442" width="600" height="62" rx="6" fill="#dd9d77" fill-opacity="0.1" stroke="#dd9d77" stroke-width="1" stroke-opacity="0.42"/><text x="52" y="468" font-size="15" fill="#dd9d77" font-weight="600">Linux kernel</text><text x="52" y="489" font-size="13" fill="#8a92b8">trimmed to this laptop, including its screen and input</text><rect x="32" y="512" width="600" height="62" rx="6" fill="none" stroke="#343a55" stroke-width="1" stroke-dasharray="5 5"/><text x="52" y="538" font-size="15" fill="#8a92b8" font-weight="600">The old x86 laptop</text><text x="52" y="559" font-size="13" fill="#8a92b8">CPU · RAM · disk · Ethernet · screen</text><path d="M656 96 H664 V360 H656" fill="none" stroke="#8fa2bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><text x="684" y="200" font-size="14" fill="#8fa2bc" font-weight="600">YOURS</text><text x="684" y="222" font-size="13" fill="#8a92b8">you write all of this</text><path d="M656 376 H664 V500 H656" fill="none" stroke="#dd9d77" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><text x="684" y="414" font-size="14" fill="#dd9d77" font-weight="600">BORROWED</text><text x="684" y="436" font-size="13" fill="#8a92b8">you only pick options</text>
</svg>
