<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="724" viewBox="0 0 1000 724" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">The nox stack</title>
<desc id="desc">Seven stacked layers: the panel, your projects, noxd, init, BusyBox plus dropbear plus musl, the Linux kernel and the laptop hardware. The top four layers are hand-written; the next two are borrowed.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.05}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes bar{0%,100%{opacity:1}50%{opacity:.55}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{animation:flow 1s linear infinite}
.breathe{animation:bar 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow,.breathe{animation:none}}
</style>
<defs>
<linearGradient id="pk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff79c6"/><stop offset="1" stop-color="#bb9af7"/></linearGradient>
<linearGradient id="cy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dcfff"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#73daca"/><stop offset="1" stop-color="#9ece6a"/></linearGradient>
<linearGradient id="yo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0af68"/><stop offset="1" stop-color="#ff9e64"/></linearGradient>
<linearGradient id="or" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9e64"/><stop offset="1" stop-color="#f7768e"/></linearGradient>
<linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1c2b"/><stop offset="1" stop-color="#12131b"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="724" rx="22" fill="url(#bgp)" stroke="#3b4261" stroke-width="1"/><text x="40" y="52" font-size="28" fill="#c0caf5" font-weight="800">The nox stack</text><text x="40" y="78" font-size="14" fill="#565f89">seven layers, from the metal up to the panel</text><rect x="40" y="100" width="700" height="76" rx="14" fill="url(#pk)"/><text x="64" y="134" font-size="22" fill="#13141c" font-weight="800">The panel</text><text x="64" y="158" font-size="14" fill="#13141c" opacity="0.85">tiling windows · themes · GitHub clone · opens in a browser</text><rect x="572" y="124" width="144" height="28" rx="14" fill="#13141c" fill-opacity="0.35"/><text x="644" y="143" font-size="13" fill="#13141c" font-weight="700" text-anchor="middle">HTML · CSS · JS</text><rect x="40" y="186" width="700" height="76" rx="14" fill="#24283b" stroke="#3b4261" stroke-width="1"/><text x="64" y="216" font-size="22" fill="#c0caf5" font-weight="800">Your projects</text><rect x="64" y="228" width="150" height="26" rx="13" fill="#9ece6a" fill-opacity="0.14" stroke="#9ece6a" stroke-width="1" stroke-opacity="0.85"/><text x="139" y="245.68" font-size="13" fill="#9ece6a" text-anchor="middle">rental-agent</text><rect x="228" y="228" width="150" height="26" rx="13" fill="#ff9e64" fill-opacity="0.14" stroke="#ff9e64" stroke-width="1" stroke-opacity="0.85"/><text x="303" y="245.68" font-size="13" fill="#ff9e64" text-anchor="middle">minecraft</text><rect x="392" y="228" width="130" height="26" rx="13" fill="#7aa2f7" fill-opacity="0.14" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.85"/><text x="457" y="245.68" font-size="13" fill="#7aa2f7" text-anchor="middle">chat-bot</text><rect x="536" y="228" width="170" height="26" rx="13" fill="#565f89" fill-opacity="0.14" stroke="#565f89" stroke-width="1" stroke-opacity="0.85" stroke-dasharray="5 4"/><text x="621" y="245.68" font-size="13" fill="#565f89" text-anchor="middle">+ anything else</text><rect x="40" y="272" width="700" height="76" rx="14" fill="url(#cy)"/><text x="64" y="306" font-size="22" fill="#13141c" font-weight="800">noxd</text><text x="64" y="330" font-size="14" fill="#13141c" opacity="0.85">service runner + panel server · one self-contained program</text><rect x="681.2" y="296" width="34.8" height="28" rx="14" fill="#13141c" fill-opacity="0.35"/><text x="698.6" y="315" font-size="13" fill="#13141c" font-weight="700" text-anchor="middle">Go</text><rect x="40" y="358" width="700" height="76" rx="14" fill="url(#tl)"/><text x="64" y="392" font-size="22" fill="#13141c" font-weight="800">/init</text><text x="64" y="416" font-size="14" fill="#13141c" opacity="0.85">the first program at boot: disks, network, clock, starts noxd</text><rect x="597.2" y="382" width="118.80000000000001" height="28" rx="14" fill="#13141c" fill-opacity="0.35"/><text x="656.6" y="401" font-size="13" fill="#13141c" font-weight="700" text-anchor="middle">shell script</text><rect x="40" y="444" width="700" height="76" rx="14" fill="url(#yo)"/><text x="64" y="478" font-size="22" fill="#13141c" font-weight="800">BusyBox · dropbear · musl</text><text x="64" y="502" font-size="14" fill="#13141c" opacity="0.85">basic commands, an SSH server and the C library: a few MB</text><rect x="647.6" y="468" width="68.4" height="28" rx="14" fill="#13141c" fill-opacity="0.35"/><text x="681.8" y="487" font-size="13" fill="#13141c" font-weight="700" text-anchor="middle">static</text><rect x="40" y="530" width="700" height="76" rx="14" fill="url(#or)"/><text x="64" y="564" font-size="22" fill="#13141c" font-weight="800">Linux kernel</text><text x="64" y="588" font-size="14" fill="#13141c" opacity="0.85">trimmed down to just this laptop’s hardware</text><rect x="597.2" y="554" width="118.80000000000001" height="28" rx="14" fill="#13141c" fill-opacity="0.35"/><text x="656.6" y="573" font-size="13" fill="#13141c" font-weight="700" text-anchor="middle">your .config</text><rect x="40" y="616" width="700" height="76" rx="14" fill="#24283b" stroke="#565f89" stroke-width="1" stroke-dasharray="7 6"/><text x="64" y="650" font-size="22" fill="#9aa5ce" font-weight="800">The old x86 laptop</text><text x="64" y="674" font-size="14" fill="#565f89">CPU · RAM · disk · Ethernet · screen off</text><path d="M754 104 H768 V430 H754" fill="none" stroke="#ff79c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="790" y="226" font-size="34" fill="#ff79c6" font-weight="800">YOURS</text><text x="790" y="256" font-size="14" fill="#9aa5ce">you write every line</text><text x="790" y="276" font-size="14" fill="#9aa5ce">of these four layers</text><circle cx="796" cy="312" r="5" fill="#ff79c6" class="pulse"/><text x="810" y="317" font-size="13" fill="#ff79c6">the learning is here</text><path d="M754 448 H768 V602 H754" fill="none" stroke="#7aa2f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="790" y="514" font-size="28" fill="#7aa2f7" font-weight="800">BORROWED</text><text x="790" y="542" font-size="14" fill="#9aa5ce">someone else’s work:</text><text x="790" y="562" font-size="14" fill="#9aa5ce">you only pick options</text><text x="790" y="662" font-size="24" fill="#565f89" font-weight="800">HARDWARE</text>
</svg>
