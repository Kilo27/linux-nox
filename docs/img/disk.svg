<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">Where things live</title>
<desc id="desc">A small boot partition holds the kernel and the nox image, which is loaded into RAM at boot. A large data partition holds services, runtimes, logs, layout and tokens and survives every OS update.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.05}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes bar{0%,100%{opacity:1}50%{opacity:.55}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{animation:flow 1s linear infinite}
.breathe{animation:bar 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow,.breathe{animation:none}}
</style>
<defs>
<linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1c2b"/><stop offset="1" stop-color="#12131b"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7dcfff"/><stop offset="1" stop-color="#7aa2f7"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9e64"/><stop offset="1" stop-color="#9ece6a"/></linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="470" rx="22" fill="url(#bgd)" stroke="#3b4261" stroke-width="1"/><text x="32" y="50" font-size="26" fill="#c0caf5" font-weight="800">Where things live</text><text x="32" y="76" font-size="14" fill="#565f89">one small file for the OS, one big partition for everything you care about</text><rect x="200" y="100" width="600" height="140" rx="16" fill="#13141c" stroke="#bb9af7" stroke-width="1.5"/><text x="220" y="128" font-size="14" fill="#bb9af7" font-weight="700">RAM, while nox is running</text><rect x="220" y="142" width="190" height="62" rx="10" fill="#bb9af7" fill-opacity="0.18" stroke="#bb9af7" stroke-width="1"/><text x="315" y="168" font-size="16" fill="#bb9af7" font-weight="800" text-anchor="middle">nox OS</text><text x="315" y="188" font-size="12" fill="#9aa5ce" text-anchor="middle">kernel + tools + noxd</text><rect x="426" y="142" width="112" height="62" rx="10" fill="#9ece6a" fill-opacity="0.18" stroke="#9ece6a" stroke-width="1"/><text x="482" y="178" font-size="13" fill="#9ece6a" font-weight="700" text-anchor="middle">rental-agent</text><rect x="548" y="142" width="112" height="62" rx="10" fill="#ff9e64" fill-opacity="0.18" stroke="#ff9e64" stroke-width="1"/><text x="604" y="178" font-size="13" fill="#ff9e64" font-weight="700" text-anchor="middle">minecraft</text><rect x="670" y="142" width="112" height="62" rx="10" fill="#7aa2f7" fill-opacity="0.18" stroke="#7aa2f7" stroke-width="1"/><text x="726" y="178" font-size="13" fill="#7aa2f7" font-weight="700" text-anchor="middle">chat-bot</text><text x="220" y="226" font-size="12" fill="#565f89">projects run as plain processes, one user each</text><rect x="40" y="306" width="920" height="76" rx="16" fill="#24283b" stroke="#3b4261" stroke-width="1"/><rect x="46" y="312" width="260" height="64" rx="12" fill="url(#gb)"/><text x="66" y="338" font-size="20" fill="#13141c" font-weight="800">BOOT</text><text x="66" y="360" font-size="13" fill="#13141c" opacity="0.85">kernel + nox image</text><rect x="312" y="312" width="642" height="64" rx="12" fill="url(#gd)"/><text x="332" y="338" font-size="20" fill="#13141c" font-weight="800">/data</text><rect x="332" y="346" width="86.39999999999999" height="22" rx="11" fill="#13141c" fill-opacity="0.35"/><text x="375.2" y="361" font-size="12" fill="#13141c" font-weight="700" text-anchor="middle">services/</text><rect x="426.4" y="346" width="86.39999999999999" height="22" rx="11" fill="#13141c" fill-opacity="0.35"/><text x="469.59999999999997" y="361" font-size="12" fill="#13141c" font-weight="700" text-anchor="middle">runtimes/</text><rect x="520.8" y="346" width="56" height="22" rx="11" fill="#13141c" fill-opacity="0.35"/><text x="548.8" y="361" font-size="12" fill="#13141c" font-weight="700" text-anchor="middle">logs/</text><rect x="584.8" y="346" width="101.6" height="22" rx="11" fill="#13141c" fill-opacity="0.35"/><text x="635.5999999999999" y="361" font-size="12" fill="#13141c" font-weight="700" text-anchor="middle">layout.json</text><rect x="694.4" y="346" width="63.599999999999994" height="22" rx="11" fill="#13141c" fill-opacity="0.35"/><text x="726.1999999999999" y="361" font-size="12" fill="#13141c" font-weight="700" text-anchor="middle">tokens</text><text x="40" y="298" font-size="13" fill="#565f89">the laptop’s disk</text><path d="M176 306 V274 H315 V250" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" class="flow"/><path d="M311 258 l4 -10 l4 10" fill="none" stroke="#7aa2f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="294" font-size="13" fill="#7aa2f7" font-weight="700">loaded at every boot</text><path d="M640 306 V250" fill="none" stroke="#9ece6a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5" class="flow"/><path d="M636 258 l4 -10 l4 10" fill="none" stroke="#9ece6a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="654" y="284" font-size="13" fill="#9ece6a" font-weight="700">projects read and write here</text><text x="46" y="414" font-size="14" fill="#7aa2f7" font-weight="800">Update the OS:</text><text x="46" y="436" font-size="14" fill="#9aa5ce">replace one file, reboot.</text><text x="46" y="456" font-size="14" fill="#9aa5ce">Roll back: keep the old file.</text><text x="332" y="414" font-size="14" fill="#9ece6a" font-weight="800">Survives every OS update:</text><text x="332" y="436" font-size="14" fill="#9aa5ce">projects, game worlds, logs, window layout, tokens.</text><text x="332" y="456" font-size="14" fill="#9aa5ce">Back this partition up.</text>
</svg>
