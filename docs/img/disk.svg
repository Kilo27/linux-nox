<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">Where things live</title>
<desc id="desc">A small boot partition holds the kernel and the nox image, which is loaded into RAM at boot. A large data partition holds services, runtimes, logs, layout and tokens, and survives every OS update.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.62}}
.blink{animation:blink 1.2s steps(1) infinite}
.breathe{animation:breathe 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.breathe{animation:none}}
</style>
<rect x="0.5" y="0.5" width="899" height="379" rx="12" fill="#1a1b26" stroke="#343a55" stroke-width="1"/><text x="32" y="46" font-size="20" fill="#c0caf5" font-weight="600">Where things live</text><text x="32" y="70" font-size="13" fill="#8a92b8">one small file for the OS, one big partition for everything that matters</text><rect x="200" y="94" width="500" height="98" rx="6" fill="#1f2335" stroke="#343a55" stroke-width="1"/><text x="220" y="120" font-size="13" fill="#c0caf5" font-weight="600">RAM while nox is running</text><rect x="220" y="134" width="150" height="40" rx="4" fill="#8fa2bc" fill-opacity="0.12" stroke="#8fa2bc" stroke-width="1" stroke-opacity="0.45"/><text x="295" y="159" font-size="13" fill="#8fa2bc" text-anchor="middle">nox OS</text><rect x="384" y="134" width="96" height="40" rx="4" fill="#96b574" fill-opacity="0.1" stroke="#96b574" stroke-width="1" stroke-opacity="0.4"/><text x="432" y="159" font-size="12" fill="#96b574" text-anchor="middle">rental-agent</text><rect x="488" y="134" width="96" height="40" rx="4" fill="#dd9d77" fill-opacity="0.1" stroke="#dd9d77" stroke-width="1" stroke-opacity="0.4"/><text x="536" y="159" font-size="12" fill="#dd9d77" text-anchor="middle">minecraft</text><rect x="592" y="134" width="96" height="40" rx="4" fill="#8bc2e2" fill-opacity="0.1" stroke="#8bc2e2" stroke-width="1" stroke-opacity="0.4"/><text x="640" y="159" font-size="12" fill="#8bc2e2" text-anchor="middle">chat-bot</text><path d="M157 250 V224 H295 V198" fill="none" stroke="#8fa2bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><path d="M291 206 l4 -8 l4 8" fill="none" stroke="#8fa2bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="168" y="244" font-size="12" fill="#8a92b8">loaded at every boot</text><path d="M560 250 V198" fill="none" stroke="#96b574" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/><path d="M556 206 l4 -8 l4 8" fill="none" stroke="#96b574" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="574" y="232" font-size="12" fill="#8a92b8">projects read and write here</text><text x="32" y="246" font-size="12" fill="#8a92b8">the disk</text><rect x="32" y="250" width="250" height="56" rx="6" fill="#8fa2bc" fill-opacity="0.1" stroke="#8fa2bc" stroke-width="1" stroke-opacity="0.42"/><text x="50" y="274" font-size="13" fill="#8fa2bc" font-weight="600">BOOT</text><text x="50" y="294" font-size="12" fill="#8a92b8">kernel + nox image</text><rect x="290" y="250" width="578" height="56" rx="6" fill="#96b574" fill-opacity="0.1" stroke="#96b574" stroke-width="1" stroke-opacity="0.42"/><text x="308" y="274" font-size="13" fill="#96b574" font-weight="600">/data</text><text x="308" y="294" font-size="12" fill="#8a92b8">services · runtimes · logs · layout · tokens</text><text x="32" y="340" font-size="12" fill="#8a92b8">Update the OS: replace one file, reboot.</text><text x="32" y="358" font-size="12" fill="#8a92b8">Roll back: keep the old file.</text><text x="470" y="340" font-size="12" fill="#8a92b8">Survives every OS update.</text><text x="470" y="358" font-size="12" fill="#8a92b8">Back this partition up.</text>
</svg>
