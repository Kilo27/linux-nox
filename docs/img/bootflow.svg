<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">From power button to panel</title>
<desc id="desc">Six boot steps: power on, firmware, bootloader, kernel, init and noxd, which then starts every project and the login screen.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.62}}
.blink{animation:blink 1.2s steps(1) infinite}
.breathe{animation:breathe 3.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.breathe{animation:none}}
</style>
<rect x="0.5" y="0.5" width="1099" height="329" rx="12" fill="#1a1b26" stroke="#343a55" stroke-width="1"/><text x="32" y="46" font-size="20" fill="#c0caf5" font-weight="600">From power button to panel</text><text x="32" y="70" font-size="13" fill="#8a92b8">six steps, and the last one keeps everything running</text><rect x="22" y="92" width="156" height="118" rx="6" fill="#1f2335" stroke="#343a55" stroke-width="1"/><text x="38" y="118" font-size="12" fill="#8fa2bc">1</text><text x="56" y="118" font-size="15" fill="#c0caf5" font-weight="600">Power on</text><text x="38" y="144" font-size="13" fill="#8a92b8">press the</text><text x="38" y="163" font-size="13" fill="#8a92b8">button</text><path d="M186 144 l7 6 l-7 6" fill="none" stroke="#8fa2bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><rect x="202" y="92" width="156" height="118" rx="6" fill="#1f2335" stroke="#343a55" stroke-width="1"/><text x="218" y="118" font-size="12" fill="#8fa2bc">2</text><text x="236" y="118" font-size="15" fill="#c0caf5" font-weight="600">Firmware</text><text x="218" y="144" font-size="13" fill="#8a92b8">BIOS / UEFI picks</text><text x="218" y="163" font-size="13" fill="#8a92b8">the boot disk</text><path d="M366 144 l7 6 l-7 6" fill="none" stroke="#8fa2bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><rect x="382" y="92" width="156" height="118" rx="6" fill="#1f2335" stroke="#343a55" stroke-width="1"/><text x="398" y="118" font-size="12" fill="#8fa2bc">3</text><text x="416" y="118" font-size="15" fill="#c0caf5" font-weight="600">Bootloader</text><text x="398" y="144" font-size="13" fill="#8a92b8">loads the kernel</text><text x="398" y="163" font-size="13" fill="#8a92b8">and the OS file</text><path d="M546 144 l7 6 l-7 6" fill="none" stroke="#8fa2bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><rect x="562" y="92" width="156" height="118" rx="6" fill="#1f2335" stroke="#343a55" stroke-width="1"/><text x="578" y="118" font-size="12" fill="#8fa2bc">4</text><text x="596" y="118" font-size="15" fill="#c0caf5" font-weight="600">Kernel</text><text x="578" y="144" font-size="13" fill="#8a92b8">wakes the</text><text x="578" y="163" font-size="13" fill="#8a92b8">hardware, unpacks</text><text x="578" y="182" font-size="13" fill="#8a92b8">the OS into RAM</text><path d="M726 144 l7 6 l-7 6" fill="none" stroke="#8fa2bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><rect x="742" y="92" width="156" height="118" rx="6" fill="#1f2335" stroke="#343a55" stroke-width="1"/><text x="758" y="118" font-size="12" fill="#8fa2bc">5</text><text x="776" y="118" font-size="15" fill="#c0caf5" font-weight="600">/init</text><text x="758" y="144" font-size="13" fill="#8a92b8">mounts disks,</text><text x="758" y="163" font-size="13" fill="#8a92b8">brings up network</text><text x="758" y="182" font-size="13" fill="#8a92b8">and the clock</text><path d="M906 144 l7 6 l-7 6" fill="none" stroke="#8fa2bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><rect x="922" y="92" width="156" height="118" rx="6" fill="#8fa2bc" fill-opacity="0.1" stroke="#8fa2bc" stroke-width="1" stroke-opacity="0.55"/><text x="938" y="118" font-size="12" fill="#8fa2bc">6</text><text x="956" y="118" font-size="15" fill="#8fa2bc" font-weight="600">noxd</text><text x="938" y="144" font-size="13" fill="#8a92b8">starts every</text><text x="938" y="163" font-size="13" fill="#8a92b8">project and the</text><text x="938" y="182" font-size="13" fill="#8a92b8">login screen</text><line x1="1000" y1="210" x2="1000" y2="244" stroke="#8fa2bc" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.7"/><text x="22" y="262" font-size="13" fill="#8a92b8">noxd then runs, all at once:</text><rect x="262" y="244" width="134.8" height="28" rx="4" fill="#96b574" fill-opacity="0.1" stroke="#96b574" stroke-width="1" stroke-opacity="0.45"/><text x="329.4" y="262.5" font-size="13" fill="#96b574" text-anchor="middle">rental-agent</text><rect x="408.8" y="244" width="109.60000000000001" height="28" rx="4" fill="#dd9d77" fill-opacity="0.1" stroke="#dd9d77" stroke-width="1" stroke-opacity="0.45"/><text x="463.6" y="262.5" font-size="13" fill="#dd9d77" text-anchor="middle">minecraft</text><rect x="530.4" y="244" width="101.2" height="28" rx="4" fill="#8bc2e2" fill-opacity="0.1" stroke="#8bc2e2" stroke-width="1" stroke-opacity="0.45"/><text x="581" y="262.5" font-size="13" fill="#8bc2e2" text-anchor="middle">chat-bot</text><rect x="643.6" y="244" width="134.8" height="28" rx="4" fill="#b8a1e1" fill-opacity="0.1" stroke="#b8a1e1" stroke-width="1" stroke-opacity="0.45"/><text x="711" y="262.5" font-size="13" fill="#b8a1e1" text-anchor="middle">login screen</text><text x="22" y="300" font-size="13" fill="#8a92b8">a crash in one never touches the others</text>
</svg>
