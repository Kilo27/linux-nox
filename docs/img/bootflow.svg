<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc" font-family="ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
<title id="title">From power button to panel</title>
<desc id="desc">Six boot steps: power on, firmware, bootloader, kernel, init and noxd, which then starts every project and the panel in parallel.</desc>
<style>
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.05}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes bar{0%,100%{opacity:1}50%{opacity:.55}}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.flow{animation:flow 1s linear infinite}
.breathe{animation:bar 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.blink,.pulse,.flow,.breathe{animation:none}}
</style>
<defs>
<linearGradient id="bgf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1c2b"/><stop offset="1" stop-color="#12131b"/></linearGradient>
</defs>
<rect x="0" y="0" width="1100" height="440" rx="22" fill="url(#bgf)" stroke="#3b4261" stroke-width="1"/><text x="32" y="50" font-size="26" fill="#c0caf5" font-weight="800">From power button to panel</text><text x="32" y="76" font-size="14" fill="#565f89">six steps, and the last one keeps everything running</text><rect x="22" y="100" width="156" height="156" rx="14" fill="#24283b" stroke="#ff79c6" stroke-width="1.5"/><path d="M22 112 A12 12 0 0 1 34 100 H166 A12 12 0 0 1 178 112 V106 H22 Z" fill="#ff79c6"/><rect x="22" y="100" width="156" height="6" rx="3" fill="#ff79c6"/><circle cx="50" cy="140" r="15" fill="#ff79c6"/><text x="50" y="146" font-size="16" fill="#13141c" font-weight="800" text-anchor="middle">1</text><text x="74" y="146" font-size="17" fill="#ff79c6" font-weight="800">Power on</text><text x="38" y="182" font-size="13" fill="#9aa5ce">press the</text><text x="38" y="202" font-size="13" fill="#9aa5ce">button</text><path d="M181 170 l12 8 l-12 8" fill="none" stroke="#bb9af7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="202" y="100" width="156" height="156" rx="14" fill="#24283b" stroke="#bb9af7" stroke-width="1.5"/><path d="M202 112 A12 12 0 0 1 214 100 H346 A12 12 0 0 1 358 112 V106 H202 Z" fill="#bb9af7"/><rect x="202" y="100" width="156" height="6" rx="3" fill="#bb9af7"/><circle cx="230" cy="140" r="15" fill="#bb9af7"/><text x="230" y="146" font-size="16" fill="#13141c" font-weight="800" text-anchor="middle">2</text><text x="254" y="146" font-size="17" fill="#bb9af7" font-weight="800">Firmware</text><text x="218" y="182" font-size="13" fill="#9aa5ce">BIOS / UEFI picks</text><text x="218" y="202" font-size="13" fill="#9aa5ce">the boot disk</text><path d="M361 170 l12 8 l-12 8" fill="none" stroke="#7aa2f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="382" y="100" width="156" height="156" rx="14" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5"/><path d="M382 112 A12 12 0 0 1 394 100 H526 A12 12 0 0 1 538 112 V106 H382 Z" fill="#7aa2f7"/><rect x="382" y="100" width="156" height="6" rx="3" fill="#7aa2f7"/><circle cx="410" cy="140" r="15" fill="#7aa2f7"/><text x="410" y="146" font-size="16" fill="#13141c" font-weight="800" text-anchor="middle">3</text><text x="434" y="146" font-size="17" fill="#7aa2f7" font-weight="800">Bootloader</text><text x="398" y="182" font-size="13" fill="#9aa5ce">loads the kernel</text><text x="398" y="202" font-size="13" fill="#9aa5ce">and the OS file</text><path d="M541 170 l12 8 l-12 8" fill="none" stroke="#7dcfff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="562" y="100" width="156" height="156" rx="14" fill="#24283b" stroke="#7dcfff" stroke-width="1.5"/><path d="M562 112 A12 12 0 0 1 574 100 H706 A12 12 0 0 1 718 112 V106 H562 Z" fill="#7dcfff"/><rect x="562" y="100" width="156" height="6" rx="3" fill="#7dcfff"/><circle cx="590" cy="140" r="15" fill="#7dcfff"/><text x="590" y="146" font-size="16" fill="#13141c" font-weight="800" text-anchor="middle">4</text><text x="614" y="146" font-size="17" fill="#7dcfff" font-weight="800">Kernel</text><text x="578" y="182" font-size="13" fill="#9aa5ce">wakes the</text><text x="578" y="202" font-size="13" fill="#9aa5ce">hardware, unpacks</text><text x="578" y="222" font-size="13" fill="#9aa5ce">the OS into RAM</text><path d="M721 170 l12 8 l-12 8" fill="none" stroke="#73daca" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="742" y="100" width="156" height="156" rx="14" fill="#24283b" stroke="#73daca" stroke-width="1.5"/><path d="M742 112 A12 12 0 0 1 754 100 H886 A12 12 0 0 1 898 112 V106 H742 Z" fill="#73daca"/><rect x="742" y="100" width="156" height="6" rx="3" fill="#73daca"/><circle cx="770" cy="140" r="15" fill="#73daca"/><text x="770" y="146" font-size="16" fill="#13141c" font-weight="800" text-anchor="middle">5</text><text x="794" y="146" font-size="17" fill="#73daca" font-weight="800">/init</text><text x="758" y="182" font-size="13" fill="#9aa5ce">mounts disks,</text><text x="758" y="202" font-size="13" fill="#9aa5ce">brings up network</text><text x="758" y="222" font-size="13" fill="#9aa5ce">and the clock</text><path d="M901 170 l12 8 l-12 8" fill="none" stroke="#9ece6a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="922" y="100" width="156" height="156" rx="14" fill="#24283b" stroke="#9ece6a" stroke-width="1.5"/><path d="M922 112 A12 12 0 0 1 934 100 H1066 A12 12 0 0 1 1078 112 V106 H922 Z" fill="#9ece6a"/><rect x="922" y="100" width="156" height="6" rx="3" fill="#9ece6a"/><circle cx="950" cy="140" r="15" fill="#9ece6a"/><text x="950" y="146" font-size="16" fill="#13141c" font-weight="800" text-anchor="middle">6</text><text x="974" y="146" font-size="17" fill="#9ece6a" font-weight="800">noxd</text><text x="938" y="182" font-size="13" fill="#9aa5ce">starts every</text><text x="938" y="202" font-size="13" fill="#9aa5ce">project, serves</text><text x="938" y="222" font-size="13" fill="#9aa5ce">the panel</text><line x1="1000" y1="256" x2="1000" y2="292" stroke="#9ece6a" stroke-width="2" stroke-dasharray="6 5" class="flow"/><rect x="520" y="292" width="558" height="120" rx="16" fill="#24283b" stroke="#9ece6a" stroke-width="1.5" stroke-opacity="0.7"/><text x="542" y="322" font-size="14" fill="#9ece6a" font-weight="700">noxd then runs, all at once:</text><rect x="542" y="340" width="128" height="30" rx="15" fill="#9ece6a" fill-opacity="0.14" stroke="#9ece6a" stroke-width="1" stroke-opacity="0.85"/><text x="606" y="359.68" font-size="13" fill="#9ece6a" text-anchor="middle">rental-agent</text><rect x="682" y="340" width="112" height="30" rx="15" fill="#ff9e64" fill-opacity="0.14" stroke="#ff9e64" stroke-width="1" stroke-opacity="0.85"/><text x="738" y="359.68" font-size="13" fill="#ff9e64" text-anchor="middle">minecraft</text><rect x="806" y="340" width="104" height="30" rx="15" fill="#7aa2f7" fill-opacity="0.14" stroke="#7aa2f7" stroke-width="1" stroke-opacity="0.85"/><text x="858" y="359.68" font-size="13" fill="#7aa2f7" text-anchor="middle">chat-bot</text><rect x="922" y="340" width="104" height="30" rx="15" fill="#ff79c6" fill-opacity="0.14" stroke="#ff79c6" stroke-width="1" stroke-opacity="0.85"/><text x="974" y="359.68" font-size="13" fill="#ff79c6" text-anchor="middle">the panel</text><text x="542" y="394" font-size="13" fill="#9aa5ce">a crash in one never touches the others</text><rect x="22" y="292" width="470" height="120" rx="16" fill="#13141c" stroke="#3b4261" stroke-width="1"/><text x="44" y="324" font-size="16" fill="#7dcfff" font-weight="800">The OS runs from RAM</text><text x="44" y="350" font-size="14" fill="#c0caf5">so a power cut can’t damage it.</text><text x="44" y="374" font-size="14" fill="#9aa5ce">Only the /data partition is ever written to,</text><text x="44" y="394" font-size="14" fill="#9aa5ce">and it is checked on every boot.</text>
</svg>
